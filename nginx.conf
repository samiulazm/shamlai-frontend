# Nginx configuration for Shamlai Frontend (VPS Deployment)
# Use this when deploying to VPS with Nginx as reverse proxy

events {
    worker_connections 1024;
}

http {
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Cache settings
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=nextjs_cache:10m max_size=1g inactive=60m use_temp_path=off;

    upstream nextjs {
        server localhost:3000;  # Change to your Next.js app port
        keepalive 64;
    }

    # HTTP server (redirect to HTTPS)
    server {
        listen 80;
        server_name your-domain.com www.your-domain.com;  # Replace with your domain

        # Redirect all HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2;
        server_name your-domain.com www.your-domain.com;  # Replace with your domain

        # SSL certificates (use Let's Encrypt)
        ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Static files with long cache
        location /_next/static {
            proxy_pass http://nextjs;
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            expires 1y;
        }

        # API routes with shorter cache
        location /api/products {
            proxy_pass http://nextjs;
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 5m;
            add_header Cache-Control "public, s-maxage=300, stale-while-revalidate=600";
        }

        location /api/shop {
            proxy_pass http://nextjs;
            proxy_cache nextjs_cache;
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, s-maxage=3600, stale-while-revalidate=7200";
        }

        # Main proxy to Next.js app
        location / {
            proxy_pass http://nextjs;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            
            # Cache headers for pages
            add_header Cache-Control "public, s-maxage=60, stale-while-revalidate=300";
        }

        # Health check endpoint (no cache)
        location /api/health {
            proxy_pass http://nextjs;
            access_log off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

